<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudyPulse Cloud AI - 用户中心</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/pages/dashboard/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sp-brand brand-lockup">
        <img class="sp-brand-mark brand-mark" src="../../StudyPulseLogo.png" onerror="this.onerror=null; this.src='/StudyPulseLogo.png';" alt="StudyPulse Logo">
        <div class="sp-brand-text">
          <strong class="sp-brand-title">StudyPulse</strong>
          <span class="sp-brand-subtitle">Cloud AI</span>
        </div>
      </div>
      <div class="sidebar-label">用户中心</div>
      <nav class="tabs">
        <a class="tab" data-page="/dashboard" href="/dashboard"><span class="nav-icon">⌂</span><span>仪表盘</span></a>
        <a class="tab" data-page="/contributions" href="/contributions"><span class="nav-icon">✦</span><span>代码贡献</span></a>
      </nav>
      <div class="sidebar-footer">
        <span class="sp-pulse-dot status-dot"></span>
        <span>安全连接</span>
        <button class="logout sp-btn sp-btn-ghost sp-btn-sm" onclick="logout()">退出</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <div class="eyebrow">StudyPulse Cloud AI <span class="sp-badge sp-badge-primary badge">用户控制台</span></div>
          <h1 id="pageTitle">用户中心</h1>
        </div>
        <div class="topbar-status">
          <span class="sp-pulse-dot status-dot"></span>
          <span>安全连接</span>
          <button class="sp-btn sp-btn-secondary sp-btn-sm" onclick="toggleTheme()" title="切换亮暗主题" style="margin-right: 6px;">🌓 主题</button>
          <button class="sp-btn sp-btn-secondary sp-btn-sm" onclick="refreshPage()">↻ 刷新数据</button>
        </div>
      </header>
      <section class="content">
        <div id="app" class="loading">
          <div class="sp-spinner" style="margin-bottom: 12px;"></div>
          <div>加载中...</div>
        </div>
      </section>
    </main>
  </div>
  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sp-theme', next);
    }
    const savedTheme = localStorage.getItem('sp-theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  </script>
  <script src="./app.js" defer></script>
  <script src="/pages/dashboard/app.js" defer></script>
</body>
</html>
