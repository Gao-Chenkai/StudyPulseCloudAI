<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>异常反馈 · StudyPulse Cloud AI</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/pages/support/styles.css">
</head>
<body>
  <div class="wrap">
    <div id="loginView" class="login card sp-glass-card">
      <div class="sp-brand brand">
        <img class="sp-brand-mark" src="../../StudyPulseLogo.png" onerror="this.onerror=null; this.src='/StudyPulseLogo.png';" alt="StudyPulse Logo">
        <div class="sp-brand-text">
          <strong class="sp-brand-title">StudyPulse</strong>
          <span class="sp-brand-subtitle">Cloud AI · Support</span>
        </div>
      </div>
      <h1 style="margin-top:30px">异常反馈</h1>
      <p class="lead">登录后提交反馈，并跟踪处理进度。</p>
      
      <div id="loginForm">
        <div class="sp-field">
          <label class="sp-label">邮箱</label>
          <input id="email" class="sp-input" type="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="sp-field">
          <label class="sp-label">密码登录</label>
          <input id="password" class="sp-input" type="password" autocomplete="current-password" placeholder="输入账号密码">
        </div>
        <div class="actions">
          <button class="sp-btn sp-btn-primary" onclick="loginPassword()">密码登录</button>
          <button class="sp-btn sp-btn-secondary" onclick="toggleCode()">验证码登录</button>
        </div>
      </div>

      <div id="codeForm" class="hidden">
        <div class="sp-field">
          <label class="sp-label">邮箱</label>
          <input id="codeEmail" class="sp-input" type="email" placeholder="you@example.com">
        </div>
        <div class="actions">
          <button class="sp-btn sp-btn-secondary" onclick="sendCode()">发送验证码</button>
          <input id="code" class="sp-input" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
        </div>
        <button class="sp-btn sp-btn-primary" style="margin-top:12px; width: 100%;" onclick="loginCode()">验证码登录</button>
        <p class="hint" style="margin-top:16px">没有账号？可在主站完成注册后登录。</p>
      </div>
      <p id="loginMsg" class="msg"></p>
    </div>

    <div id="appView" class="hidden">
      <div class="top">
        <div class="sp-brand brand">
          <img class="sp-brand-mark" src="../../StudyPulseLogo.png" onerror="this.onerror=null; this.src='/StudyPulseLogo.png';" alt="StudyPulse Logo">
          <div class="sp-brand-text">
            <strong class="sp-brand-title">StudyPulse</strong>
            <span class="sp-brand-subtitle">Cloud AI · Support</span>
          </div>
        </div>
        <div class="user">
          <span id="userEmail"></span> · <button class="sp-btn sp-btn-ghost sp-btn-sm" style="padding:6px 10px" onclick="logout()">退出</button>
        </div>
      </div>
      
      <h1>异常反馈</h1>
      <p class="lead">提交后，管理团队会按优先级和提交时间处理。</p>
      
      <div class="grid">
        <section class="card sp-card">
          <h2>新建反馈工单</h2>
          <p class="hint">请尽量描述复现步骤、发生时间和期望结果。</p>
          <form onsubmit="createTicket(event)">
            <div class="row">
              <div class="sp-field">
                <label class="sp-label">主题</label>
                <input id="subject" class="sp-input" maxlength="120" required placeholder="例如：对话页面无法加载">
              </div>
              <div class="sp-field">
                <label class="sp-label">优先级</label>
                <select id="priority" class="sp-select">
                  <option value="normal">普通</option>
                  <option value="urgent">紧急</option>
                  <option value="top">顶级 · Pro 专享</option>
                </select>
              </div>
            </div>
            <div class="sp-field">
              <label class="sp-label">反馈内容</label>
              <textarea id="content" class="sp-textarea" maxlength="5000" required placeholder="请描述遇到的异常..."></textarea>
            </div>
            <div class="actions">
              <button class="sp-btn sp-btn-primary">提交工单</button>
              <span id="ticketMsg" class="msg"></span>
            </div>
          </form>
        </section>
        
        <section class="card sp-card">
          <h2>我的反馈</h2>
          <p class="hint">处理完成后会在这里显示处理内容。</p>
          <div id="ticketList">
            <p class="msg">加载中...</p>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="./app.js" defer></script>
  <script src="/pages/support/app.js" defer></script>
</body>
</html>
