<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>异常反馈 · StudyPulse</title><link rel="stylesheet" href="/pages/support/styles.css"></head><body><div class="wrap"><div id="loginView" class="login card"><div class="brand"><div class="mark">S</div><div>StudyPulse<small>Cloud AI · Support</small></div></div><h1 style="margin-top:30px">异常反馈</h1><p class="lead">登录后提交反馈，并跟踪处理进度。</p><div id="loginForm"><label>邮箱</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label>密码登录</label><input id="password" type="password" autocomplete="current-password" placeholder="输入账号密码"><div class="actions"><button class="btn primary" onclick="loginPassword()">密码登录</button><button class="btn ghost" onclick="toggleCode()">验证码登录</button></div></div><div id="codeForm" class="hidden"><label>邮箱</label><input id="codeEmail" type="email" placeholder="you@example.com"><div class="actions"><button class="btn ghost" onclick="sendCode()">发送验证码</button><input id="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码"></div><button class="btn primary" style="margin-top:12px" onclick="loginCode()">验证码登录</button><p class="hint" style="margin-top:16px">没有账号？可在主站完成注册后登录。</p></div><p id="loginMsg" class="msg"></p></div><div id="appView" class="hidden"><div class="top"><div class="brand"><div class="mark">S</div><div>StudyPulse<small>Cloud AI · Support</small></div></div><div class="user"><span id="userEmail"></span> · <button class="btn ghost" style="padding:6px 10px" onclick="logout()">退出</button></div></div><h1>异常反馈</h1><p class="lead">提交后，管理团队会按优先级和提交时间处理。</p><div class="grid"><section class="card"><h2>新建反馈工单</h2><p class="hint">请尽量描述复现步骤、发生时间和期望结果。</p><form onsubmit="createTicket(event)"><div class="row"><div><label>主题</label><input id="subject" maxlength="120" required placeholder="例如：对话页面无法加载"></div><div><label>优先级</label><select id="priority"><option value="normal">普通</option><option value="urgent">紧急</option><option value="top">顶级 · Pro 专享</option></select></div></div><label>反馈内容</label><textarea id="content" maxlength="5000" required placeholder="请描述遇到的异常..."></textarea><div class="actions"><button class="btn primary">提交工单</button><span id="ticketMsg" class="msg"></span></div></form></section><section class="card"><h2>我的反馈</h2><p class="hint">处理完成后会在这里显示处理内容。</p><div id="ticketList"><p class="msg">加载中...</p></div></section></div></div></div><script src="/pages/support/app.js" defer></script></body></html>
