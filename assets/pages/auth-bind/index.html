<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>绑定邮箱 · StudyPulse</title><link rel="stylesheet" href="/pages/auth-bind/styles.css"><main class="card"><h1>绑定并验证邮箱</h1><p>GitHub 未提供可用的已验证邮箱。请绑定一个邮箱，完成验证后继续登录。</p><form id="form"><input type="hidden" name="challenge" value=""><label>邮箱地址</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com"><label>验证码</label><div class="code"><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="6 位验证码"><button id="send" type="button">获取验证码</button></div><button type="submit">完成绑定并登录</button><p id="status" class="message"></p></form></main><script src="/pages/auth-bind/app.js" defer></script></html>
