<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · StudyPulse Cloud AI</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/pages/auth/styles.css">
</head>
<body>
  <div class="page">
    <aside class="brand">
      <div class="sp-brand mark">
        <img class="sp-brand-mark" src="../../StudyPulseLogo.png" onerror="this.onerror=null; this.src='/StudyPulseLogo.png';" alt="StudyPulse Logo">
        <div class="sp-brand-text">
          <strong class="sp-brand-title">StudyPulse</strong>
          <span class="sp-brand-subtitle">Cloud AI</span>
        </div>
      </div>
      <div class="intro">
        <p class="sp-badge sp-badge-primary">StudyPulse App</p>
        <h1>让每一次学习，<br>都更有节奏。</h1>
        <p>登录 StudyPulse App，继续使用你的 AI 学习工具与云端资源。</p>
      </div>
    </aside>

    <main class="main">
      <div class="wrap">
        <div class="top">
          <span>StudyPulse App</span>
          <span class="secure"><span class="sp-pulse-dot" style="margin-right: 6px;"></span>安全连接</span>
        </div>
        <section class="card sp-glass-card">
          <div class="head">
            <h2>欢迎回来</h2>
            <p>登录你的 App 账号以继续</p>
          </div>
          <div class="tabs">
            <button class="tab active" type="button" data-tab="password">密码登录</button>
            <button class="tab" type="button" data-tab="code">验证码登录</button>
          </div>
          
          <form class="form active" id="password">
            <div class="field sp-field">
              <label class="sp-label">邮箱地址</label>
              <input class="sp-input" name="email" type="email" autocomplete="email" required placeholder="name@example.com">
            </div>
            <div class="field sp-field">
              <label class="sp-label">密码</label>
              <input class="sp-input" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码">
            </div>
            <a class="link" id="forgot">忘记密码？</a>
            <button class="submit sp-btn sp-btn-primary sp-btn-lg">登录</button>
          </form>

          <form class="form" id="code">
            <div class="field sp-field">
              <label class="sp-label">邮箱地址</label>
              <input class="sp-input" name="email" type="email" autocomplete="email" required placeholder="name@example.com">
            </div>
            <div class="field sp-field">
              <label class="sp-label">验证码</label>
              <div class="row">
                <input class="sp-input" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="6 位验证码">
                <button class="send-code sp-btn sp-btn-secondary" type="button">获取验证码</button>
              </div>
            </div>
            <button class="submit sp-btn sp-btn-primary sp-btn-lg">登录</button>
            <p class="helper">首次验证码登录会引导你设置密码</p>
          </form>

          <form class="aux" id="setup">
            <p class="helper">该邮箱尚未设置密码，请先设置密码</p>
            <input type="hidden" name="setup_token">
            <div class="field sp-field">
              <label class="sp-label">设置密码</label>
              <input class="sp-input" name="password" type="password" minlength="10" required placeholder="至少 10 个字符">
            </div>
            <button class="submit sp-btn sp-btn-primary sp-btn-lg">设置密码并登录</button>
          </form>

          <form class="aux" id="reset">
            <p class="helper">输入邮箱并验证后即可重置密码</p>
            <div class="field sp-field">
              <label class="sp-label">邮箱地址</label>
              <input class="sp-input" name="email" type="email" required placeholder="name@example.com">
            </div>
            <div class="field sp-field">
              <label class="sp-label">验证码</label>
              <div class="row">
                <input class="sp-input" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="6 位验证码">
                <button class="send-code sp-btn sp-btn-secondary" type="button">获取验证码</button>
              </div>
            </div>
            <div class="field sp-field">
              <label class="sp-label">新密码</label>
              <input class="sp-input" name="new_password" type="password" minlength="10" required placeholder="至少 10 个字符">
            </div>
            <button class="submit sp-btn sp-btn-primary sp-btn-lg">重置密码并登录</button>
          </form>

          <div class="divider">其他登录方式</div>
          <a class="github sp-btn sp-btn-secondary sp-btn-lg" href="/oauth/github/start">使用 GitHub 登录</a>
          <p class="message" id="message" role="status" aria-live="polite"></p>
        </section>
        <div class="copyright">登录即表示你同意 StudyPulse 的服务条款</div>
      </div>
    </main>
  </div>
  <script src="./app.js" defer></script>
  <script src="/pages/auth/app.js" defer></script>
</body>
</html>
